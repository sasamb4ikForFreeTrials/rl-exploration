<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ε-жадная стратегия</title>
<style>
:root { color-scheme: light; }
* {box-sizing: border-box;}
body {margin:0; padding:22px 20px 24px; background:#fff; color:#262626; font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; }
.figure {max-width:1070px;margin:0 auto;}
svg {width:100%;height:auto;display:block;overflow:visible;}
.param-row {display:flex;flex-wrap:wrap;gap:18px 32px;margin:5px auto 0;padding:17px 8px 0;border-top:1px solid #e7e7e7;align-items:start;justify-content:center;}
.parameter {min-width:248px;flex:0 1 390px;}
.parameter-top {display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin-bottom:8px;}
.parameter label {font-size:15px;font-weight:600;}
.parameter output {font:600 15px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums;}
.parameter input {width:100%;cursor:pointer;accent-color:#555;display:block;margin:0;height:17px;}
.parameter small {display:block;font-size:12px;line-height:1.45;color:#656565;margin-top:7px;}
@media (max-width:600px) {body{padding:9px 5px 18px}.param-row{margin:0 9px;padding-top:12px;gap:13px}.parameter{min-width:210px}.parameter label{font-size:13px}.parameter small{font-size:11px}}
</style>
</head>
<body>
<main class="figure">
<svg id="chart"></svg>
<section class="param-row" aria-label="Параметры шума"><div class="parameter"><div class="parameter-top"><label for="epsilon">ε</label><output id="epsValue">0.20</output></div><input id="epsilon" type="range" min="0" max="1" step="0.01" value="0.2" aria-label="ε"><small>Вероятность заменить действие случайным из диапазона [−1, 1].</small></div></section>
</main>

'use strict';
const NS='http://www.w3.org/2000/svg';
const svg = document.getElementById('chart');
const W=1000,H=470, m={left:88,right:20,top:54,bottom:72};
const pw=W-m.left-m.right, ph=H-m.top-m.bottom;
const X=t=>m.left+(t/150)*pw;
const Y=v=>m.top+((1.2-v)/2.4)*ph;
const T=150;
const base=Array.from({length:T},(_,i)=>0.5*Math.sin(2*Math.PI*i/T));
function el(tag,attrs={},parent=svg){
 const e=document.createElementNS(NS,tag);
 for(const [key,value] of Object.entries(attrs)){if(key==='text')e.textContent=value;else e.setAttribute(key,value);}
 parent.appendChild(e);return e;
}
function line(x1,y1,x2,y2,stroke,width=1,dash=null,parent=svg){
 const p=el('line',{x1,y1,x2,y2,stroke,'stroke-width':width},parent);
 if(dash)p.setAttribute('stroke-dasharray',dash);
 return p;
}
function textAt(x,y,t,extra={},parent=svg){
 return el('text',{x,y,text:t,'font-family':'DejaVu Sans, Arial, sans-serif','font-size':15,fill:'#222',...extra},parent);
}
function drawStatic(title, sampleColor, sampleLabel){
 svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
 svg.setAttribute('role','img');
 svg.setAttribute('aria-label',title+': сравнение действия политики и действия с шумом');
 const defs=el('defs');const cl=el('clipPath',{id:'plotClip'},defs);
 el('rect',{x:m.left,y:m.top,width:pw,height:ph},cl);
 el('rect',{x:m.left,y:m.top,width:pw,height:ph,fill:'#fff'});
 for(let v=-1;v<=1.0001;v+=.5){
  const yy=Y(v);line(m.left,yy,m.left+pw,yy,'#e2e2e2',1);
  textAt(m.left-12,yy+5,Math.abs(v)<1e-8?'0.0':v.toFixed(1).replace('-', '−'),{'text-anchor':'end','font-size':15});
 }
 for(let t=0;t<=140;t+=20){
  const xx=X(t);line(xx,m.top,xx,m.top+ph,'#e7e7e7',1);
  textAt(xx,m.top+ph+26,String(t),{'text-anchor':'middle','font-size':14});
 }
 line(m.left,Y(0),m.left+pw,Y(0),'#aaa',1.4,'6 5');
 el('rect',{x:m.left,y:m.top,width:pw,height:ph,fill:'none',stroke:'#444','stroke-width':1.2});
 textAt(W/2,33,title,{'text-anchor':'middle','font-size':23,'font-weight':'400'});
 textAt(W/2,H-17,'Время (шаги)',{'text-anchor':'middle','font-size':17});
 const ylabel=textAt(26,m.top+ph/2,'Значение действия',{'text-anchor':'middle','font-size':17});
 ylabel.setAttribute('transform',`rotate(-90 26 ${m.top+ph/2})`);
 const pathsG=el('g',{'clip-path':'url(#plotClip)'});
 const basePath=el('path',{fill:'none',stroke:'#161616','stroke-width':2.25,'stroke-dasharray':'8 5','stroke-linecap':'round','stroke-linejoin':'round'},pathsG);
 basePath.setAttribute('d',path(base));
 const samplePath=el('path',{fill:'none',stroke:sampleColor,'stroke-width':1.75,'stroke-opacity':'.9','stroke-linejoin':'round','stroke-linecap':'round'},pathsG);
 // Same compact legend arrangement as matplotlib's upper-right legend.
 const legendWidth=Math.max(229, Math.min(269, Math.round(sampleLabel.length*6.7+68)));
 const lx=m.left+pw-legendWidth-10,ly=m.top+10;
 el('rect',{x:lx,y:ly,width:legendWidth,height:62,fill:'#fff',stroke:'#d7d7d7','stroke-width':1,rx:3});
 line(lx+13,ly+22,lx+43,ly+22,'#171717',2.6,'8 5');
 textAt(lx+51,ly+27,'Действие политики π(s)',{'font-size':14});
 line(lx+13,ly+45,lx+43,ly+45,sampleColor,2.6);
 textAt(lx+51,ly+50,sampleLabel,{'font-size':14});
 return samplePath;
}
function path(vals){return vals.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(2)} ${Y(v).toFixed(2)}`).join(' ')}
function setSamples(p,vals){p.setAttribute('d',path(vals));}
function displayValue(id,value,digits=2){document.getElementById(id).textContent=Number(value).toFixed(digits);}

const samples=drawStatic("ε-жадная стратегия", "#ff4040", "Действие с ε-greedy");
function update(){const eps=Number(document.getElementById('epsilon').value);displayValue('epsValue',eps);
  setSamples(samples,base.map((v,i)=>randomDecisions[i]<eps?randomActions[i]:v));}
  document.getElementById('epsilon').addEventListener('input',update);update();
</script>
